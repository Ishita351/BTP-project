<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge-Adaptive Image Steganography</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
}
.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}
h1 { text-align: center; margin-bottom: 8px; }
.subtitle { text-align: center; color: #6b7280; margin-bottom: 30px; }
.card {
    background: white;
    padding: 25px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
}
h2 { margin-top: 0; }
label {
    display: block;
    font-weight: bold;
    margin: 15px 0 7px;
}
input[type=file], input[type=password], textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
}
textarea { min-height: 120px; resize: vertical; }
button {
    margin-top: 18px;
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #111827;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
button:hover { opacity: .9; }
.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
}
.success {
    background: #dcfce7;
    color: #166534;
    padding: 12px;
    border-radius: 8px;
    white-space: pre-wrap;
}
.note { color: #6b7280; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
    <h1>Edge-Adaptive Image Steganography</h1>
    <p class="subtitle">AES-256-GCM encrypted message hiding in image edge pixels</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <div class="card">
        <h2>1. Embed Secret Message</h2>
        <form action="/embed" method="POST" enctype="multipart/form-data">
            <label>Cover Image</label>
            <input type="file" name="cover" accept=".png,.bmp,.jpg,.jpeg" required>
            <p class="note">The generated stego image will always be PNG.</p>

            <label>Secret Message</label>
            <textarea name="message" placeholder="Enter the message to hide..." required></textarea>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter encryption password" required>

            <button type="submit">Encrypt & Embed</button>
        </form>
    </div>

    <div class="card">
        <h2>2. Extract Secret Message</h2>
        <form action="/extract" method="POST" enctype="multipart/form-data">
            <label>Stego Image</label>
            <input type="file" name="stego" accept=".png,.bmp" required>

            <label>Password</label>
            <input type="password" name="extract_password" placeholder="Enter password" required>

            <button type="submit">Extract & Decrypt</button>
        </form>

        {% if extracted %}
        <div class="success" style="margin-top:20px;"><strong>Recovered message:</strong>

{{ extracted }}</div>
        {% endif %}
    </div>
</div>
</body>
</html>
